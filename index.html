<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cartograph — your repo, as a city</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <main id="app">
      <form id="repo-form" class="launcher" autocomplete="off">
        <input id="repo-input" name="repo" type="text" placeholder="github.com/owner/repo" spellcheck="false" aria-label="GitHub repository URL" />
        <button type="submit" class="btn btn-primary">Visualize</button>
        <button type="button" id="demo-btn" class="btn">Try a demo</button>
      </form>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
